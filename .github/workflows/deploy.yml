name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without a commit.
  workflow_dispatch:

# What the GITHUB_TOKEN is allowed to do in this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in step with the version you run locally: `zola --version`.
  ZOLA_VERSION: "0.23.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zola
        run: |
          curl -fsSL \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin zola
          zola --version

      - name: Build
        run: zola build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
